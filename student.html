<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>منصة الطالب | Easy Chemistry</title><link rel="stylesheet" href="styles.css"><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="supabase-config.js"></script>
<style>
.page{padding:30px 6%}.account{position:relative}.account-btn{border:1px solid #eee;background:#fff;padding:10px 14px;border-radius:10px;cursor:pointer;font:inherit}.account-menu{display:none;position:absolute;right:0;top:45px;background:#fff;border:1px solid #eee;border-radius:14px;padding:16px;width:300px;box-shadow:0 15px 40px #0002;z-index:30}.account-menu.show{display:block}.account-menu input,.account-menu select{width:100%;padding:10px;border:1px solid #ddd;border-radius:8px;margin:6px 0;font:inherit}.course-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:18px}.card{border:1px solid #eee;border-radius:16px;padding:20px;background:#fff}.card p{color:#777;font-size:13px}.redbtn{border:0;background:#d71920;color:#fff;padding:10px 15px;border-radius:9px;font:inherit;font-weight:700;cursor:pointer}.tabs2{display:flex;gap:8px;flex-wrap:wrap;margin:20px 0}.tab{border:0;background:#f5f5f5;padding:10px 14px;border-radius:9px;cursor:pointer;font:inherit}.tab.active{background:#d71920;color:#fff}.mistake{border:1px solid #ffd5d5;background:#fffafa;border-radius:12px;padding:15px;margin:9px 0}.course-view{display:none}.lecture{border:1px solid #eee;border-radius:14px;padding:16px;margin:10px 0}.video-wrap{background:#111;border-radius:13px;overflow:hidden;margin-top:10px}.video-wrap video{width:100%;max-height:600px;display:block}.controls{display:flex;gap:7px;flex-wrap:wrap;margin-top:8px}.controls select,.controls button{padding:7px;border-radius:7px;border:1px solid #ddd;background:#fff;font:inherit}.exam-card{border:1px solid #eee;padding:15px;border-radius:12px;margin:9px 0}@media(max-width:850px){.course-grid{grid-template-columns:1fr}}
</style></head><body>
<header class="topbar"><div class="brand"><div class="brand-mark">⚗</div><div><h1>Easy Chemistry</h1><small>Dr/Ahmed Mahmoud</small></div></div>
<div style="display:flex;align-items:center;gap:8px"><div class="account"><button class="account-btn" onclick="toggleAccount()">👤 حسابي</button><div id="accountMenu" class="account-menu"><b>بياناتي</b><div id="accountInfo" style="font-size:12px;color:#777"></div><label>الصف</label><select id="myGrade"><option>الصف الرابع الابتدائي</option><option>الصف الخامس الابتدائي</option><option>الصف السادس الابتدائي</option><option>الصف الاول الإعدادي</option><option>الصف الثاني الإعدادي</option><option>الصف الثالث الإعدادي</option><option>الصف الاول الثانوي</option><option>الصف الثاني الثانوي عام</option><option>الصف الثاني الثانوي بكالوريا</option><option>الصف الثالث الثانوي</option></select><button class="redbtn" onclick="saveProfile()" style="width:100%">حفظ الصف</button></div></div><button class="login" onclick="logout()" style="border:0;cursor:pointer;font:inherit">خروج</button></div></header>
<main class="page"><div class="student-hero" style="background:#fff5f5;border-radius:20px;padding:25px"><span class="eyebrow">منصة الطالب</span><h2>أهلاً <span id="name">طالب</span> 👋</h2><p style="color:#777">ذاكر محاضراتك، حل امتحاناتك، وراجع أخطاءك.</p></div>
<div class="tabs2"><button class="tab active" onclick="showTab('courses',this)">📚 كورساتي</button><button class="tab" onclick="showTab('mistakes',this)">❌ أخطائي</button></div>
<section id="courses"><div id="courseGrid" class="course-grid">جاري التحميل...</div></section>
<section id="mistakes" style="display:none"><h2>الأسئلة التي أخطأت فيها</h2><div id="mistakeList">جاري التحميل...</div></section>
<section id="courseView" class="course-view"><button class="tab" onclick="backCourses()">← العودة للكورسات</button><div id="courseContent"></div></section>
</main>
<script>
const db=supabase.createClient(SUPABASE_URL,SUPABASE_PUBLISHABLE_KEY);let user,profile;
function esc(s){return String(s||'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[m]))}
async function init(){const {data:{user:u}}=await db.auth.getUser();if(!u){location.href='login.html';return}user=u;const p=await db.from('profiles').select('*').eq('id',u.id).single();if(p.error||p.data?.role!=='student'){location.href='login.html';return}profile=p.data;$('name').textContent=profile.full_name||'طالب';$('myGrade').value=profile.grade||'الصف الرابع الابتدائي';$('accountInfo').innerHTML=`<p><b>الاسم:</b> ${esc(profile.full_name)}</p><p><b>رقم الطالب:</b> ${esc(profile.phone)}</p><p><b>ولي الأمر:</b> ${esc(profile.guardian_phone)}</p>`;loadCourses();loadMistakes()}
async function loadCourses(){const r=await db.from('courses').select('*').eq('published',true).order('created_at',{ascending:false});$('courseGrid').innerHTML=r.data?.length?r.data.map(c=>`<article class="card"><span class="eyebrow">${esc(c.grade||'كيمياء')}</span><h3>${esc(c.title)}</h3><p>${esc(c.description)}</p><button class="redbtn" onclick="openCourse(${c.id})">دخول الكورس</button></article>`).join(''):'<p>لا توجد كورسات منشورة.</p>'}
async function openCourse(id){$('courses').style.display='none';$('mistakes').style.display='none';$('courseView').style.display='block';const c=(await db.from('courses').select('*').eq('id',id).single()).data;const l=(await db.from('lectures').select('*').eq('course_id',id).eq('published',true).order('position')).data||[];const e=(await db.from('exams').select('*').eq('course_id',id).eq('published',true).order('created_at')).data||[];let html=`<div class="student-hero" style="margin-top:20px"><span class="eyebrow">${esc(c?.grade)}</span><h2>${esc(c?.title)}</h2><p>${esc(c?.description)}</p></div><h2>المحاضرات</h2>`;for(const x of l){const va=(await db.from('video_assets').select('*').eq('lecture_id',x.id).order('quality')).data||[];let video='';if(va.length){const urls={};for(const v of va){const s=await db.storage.from('course-media').createSignedUrl(v.storage_path,3600);if(!s.error)urls[v.quality]=s.data.signedUrl}const first=urls[va[va.length-1].quality]||Object.values(urls)[0];video=`<div class="video-wrap"><video id="vid${x.id}" controls playsinline src="${first}"></video></div><div class="controls"><label>الجودة <select onchange="changeQuality(${x.id},this.value)">${va.map(v=>`<option value="${esc(urls[v.quality]||'')}">${v.quality}</option>`).join('')}</select></label><label>السرعة <select onchange="document.getElementById('vid${x.id}').playbackRate=Number(this.value)"><option>0.5</option><option>0.75</option><option selected>1</option><option>1.25</option><option>1.5</option><option>2</option></select></label><button onclick="document.getElementById('vid${x.id}').requestFullscreen?.()">⛶ ملء الشاشة</button></div>`}let pdf=x.pdf_path?`<button class="tab" onclick="openPdf('${esc(x.pdf_path)}')">📄 فتح PDF</button>`:'';html+=`<article class="lecture"><h3>${esc(x.title)}</h3><p>${esc(x.description)}</p>${video}${pdf}</article>`}html+=`<h2 style="margin-top:35px">الامتحانات</h2>`+(e.length?e.map(x=>`<div class="exam-card"><b>${esc(x.title)}</b><p>${esc(x.description||'')} — ${x.duration_minutes} دقيقة</p><button class="redbtn" onclick="location.href='exam.html?id=${x.id}'">ابدأ الامتحان</button></div>`).join(''):'<p>لا توجد امتحانات منشورة.</p>');$('courseContent').innerHTML=html}
async function changeQuality(id,url){if(url){const v=$('vid'+id);const t=v.currentTime;v.src=url;v.currentTime=t;await v.play().catch(()=>{})}}
async function openPdf(path){const s=await db.storage.from('course-media').createSignedUrl(path,3600);if(!s.error)window.open(s.data.signedUrl,'_blank')}
async function loadMistakes(){const r=await db.from('student_mistakes').select('id,question_id,last_selected_option,created_at,question_text,option_a,option_b,option_c,option_d,correct_option').eq('student_id',user.id).order('created_at',{ascending:false});if(r.error){$('mistakeList').textContent=r.error.message;return}$('mistakeList').innerHTML=r.data?.length?r.data.map(m=>`<div class="mistake"><b>${esc(m.question_text)}</b><p>إجابتك: ${esc(m.last_selected_option||'لم تجب')}</p><small>الإجابة الصحيحة: ${esc(m.correct_option)}</small></div>`).join(''):'<p>ممتاز! لا توجد أخطاء مسجلة حتى الآن.</p>'}
async function saveProfile(){const r=await db.from('profiles').update({grade:$('myGrade').value}).eq('id',user.id);if(r.error)alert(r.error.message);else alert('تم حفظ الصف.')}
function toggleAccount(){$('accountMenu').classList.toggle('show')}function showTab(id,b){$('courses').style.display=id==='courses'?'block':'none';$('mistakes').style.display=id==='mistakes'?'block':'none';$('courseView').style.display='none';document.querySelectorAll('.tab').forEach(x=>x.classList.remove('active'));b.classList.add('active')}
function backCourses(){$('courseView').style.display='none';$('courses').style.display='block'}async function logout(){await db.auth.signOut();location.href='login.html'}init();
</script></body></html>
