<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>لوحة الإدارة | Easy Chemistry</title><link rel="stylesheet" href="styles.css"><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="supabase-config.js"></script>
<style>
.wrap{padding:35px 6%}.grid2{display:grid;grid-template-columns:1fr 1fr;gap:18px}.panel{background:#fff;border:1px solid #eee;border-radius:18px;padding:22px;margin-bottom:18px}.panel h3{margin-top:0}.field{margin:9px 0}.field label{display:block;font-weight:700;font-size:12px;margin-bottom:5px}.field input,.field textarea,.field select{width:100%;padding:11px;border:1px solid #ddd;border-radius:9px;font:inherit}.field textarea{min-height:75px}.btn{border:0;cursor:pointer;font:inherit;padding:10px 15px;border-radius:9px;font-weight:700}.red{background:#d71920;color:#fff}.light{background:#f7f7f7}.danger{background:#fff0f0;color:#a00000}.list-card{border:1px solid #eee;border-radius:13px;padding:15px;margin:10px 0}.filebox{border:1px dashed #d71920;background:#fffafa;padding:12px;border-radius:10px}.form-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px}.checks{display:grid;grid-template-columns:1fr 1fr;gap:8px}.msg{padding:10px;border-radius:9px;margin:10px 0;display:none}.show{display:block}.ok{background:#eefbf1;color:#176b2a}.err{background:#fff0f0;color:#a00000}.question{border:1px solid #eee;padding:13px;border-radius:11px;margin-top:10px}.top-actions{display:flex;gap:8px;flex-wrap:wrap}@media(max-width:800px){.grid2{grid-template-columns:1fr}}
</style></head><body>
<header class="topbar"><div class="brand"><div class="brand-mark">⚗</div><div><h1>Easy Chemistry</h1><small>Admin Dashboard</small></div></div><div class="top-actions"><span id="who" style="font-size:12px;color:#777"></span><button class="login" onclick="logout()" style="border:0;cursor:pointer;font:inherit">تسجيل الخروج</button></div></header>
<main class="wrap"><div id="msg" class="msg"></div>
<div class="section-head"><div><span class="eyebrow">لوحة الإدارة</span><h2>إدارة المنصة</h2></div></div>
<div class="grid2">
<section class="panel"><h3>📚 إنشاء كورس</h3><div class="field"><label>اسم الكورس</label><input id="ct"></div><div class="field"><label>الصف</label><input id="cg"></div><div class="field"><label>الوصف</label><textarea id="cd"></textarea></div><label><input id="cp" type="checkbox"> نشر للطلاب</label><br><button class="btn red" onclick="addCourse()" style="margin-top:10px">إنشاء الكورس</button></section>
<section class="panel"><h3>🎥 إضافة محاضرة ورفع فيديو/PDF</h3><div class="field"><label>الكورس</label><select id="lc"></select></div><div class="field"><label>عنوان المحاضرة</label><input id="lt"></div><div class="field"><label>الوصف</label><textarea id="ld"></textarea></div><div class="field"><label>الترتيب</label><input id="lp" type="number" value="1" min="1"></div>
<div class="filebox"><b>الفيديوهات</b><p style="font-size:11px;color:#777">يمكنك رفع أكثر من جودة للمحاضرة. اختر ملفًا لكل جودة.</p><div class="checks">
<label>360p <input id="v360" type="file" accept="video/*"></label><label>480p <input id="v480" type="file" accept="video/*"></label><label>720p <input id="v720" type="file" accept="video/*"></label><label>1080p <input id="v1080" type="file" accept="video/*"></label></div>
</div><div class="field"><label>PDF اختياري</label><input id="pdf" type="file" accept="application/pdf"></div><label><input id="lv" type="checkbox"> نشر المحاضرة</label><br><button class="btn red" onclick="addLecture()" style="margin-top:10px">حفظ المحاضرة ورفع الملفات</button></section>
</div>
<section class="panel"><h3>📝 إنشاء امتحان MCQ</h3><div class="grid2"><div><div class="field"><label>الكورس</label><select id="ec"></select></div><div class="field"><label>اسم الامتحان</label><input id="et"></div><div class="field"><label>المدة بالدقائق</label><input id="ed" type="number" min="1" value="30"></div><div class="field"><label>الوصف</label><textarea id="exd"></textarea></div><label><input id="ep" type="checkbox"> نشر الامتحان</label></div><div><div id="questions"></div><button class="btn light" onclick="addQuestion()">+ إضافة سؤال</button><button class="btn red" onclick="createExam()" style="margin-right:8px">إنشاء الامتحان</button></div></div></section>
<section class="panel"><h3>📋 المحتوى الحالي</h3><div id="content">جاري التحميل...</div></section>
</main>
<script>
const db=supabase.createClient(SUPABASE_URL,SUPABASE_PUBLISHABLE_KEY);let courses=[],qcount=0;
const $=id=>document.getElementById(id);function show(t,ok=true){$('msg').textContent=t;$('msg').className='msg show '+(ok?'ok':'err');window.scrollTo({top:0,behavior:'smooth'});setTimeout(()=>$('msg').className='msg',5000)}
async function guard(){const {data:{session}}=await db.auth.getSession();if(!session){location.href='login.html';return false}const {data:p}=await db.from('profiles').select('role,full_name').eq('id',session.user.id).single();if(!p||p.role!=='admin'){await db.auth.signOut();location.href='login.html';return false}$('who').textContent=p.full_name||session.user.email;return true}
async function load(){const ok=await guard();if(!ok)return;const r=await db.from('courses').select('*').order('created_at',{ascending:false});if(r.error)return show(r.error.message,false);courses=r.data||[];fill();render()}
function fill(){['lc','ec'].forEach(id=>$(id).innerHTML='<option value="">اختر كورسًا</option>'+courses.map(c=>`<option value="${c.id}">${esc(c.title)}</option>`).join(''))}
function esc(s){return String(s||'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[m]))}
async function addCourse(){const title=$('ct').value.trim();if(!title)return show('اكتب اسم الكورس.',false);const r=await db.from('courses').insert({title,grade:$('cg').value.trim(),description:$('cd').value.trim(),published:$('cp').checked}).select().single();if(r.error)return show(r.error.message,false);show('تم إنشاء الكورس.');['ct','cg','cd'].forEach(x=>$(x).value='');$('cp').checked=false;load()}
async function uploadFile(file,path){const r=await db.storage.from('course-media').upload(path,file,{upsert:true,contentType:file.type});if(r.error)throw r.error;return path}
async function addLecture(){try{
 const courseId=$('lc').value,title=$('lt').value.trim();if(!courseId||!title)return show('اختر الكورس واكتب عنوان المحاضرة.',false);
 const ins=await db.from('lectures').insert({course_id:courseId,title,description:$('ld').value.trim(),position:Number($('lp').value)||1,published:$('lv').checked}).select().single();if(ins.error)throw ins.error;
 const lecture=ins.data, files=[['360p',$('v360').files[0]],['480p',$('v480').files[0]],['720p',$('v720').files[0]],['1080p',$('v1080').files[0]]];
 for(const [quality,file] of files){if(file){const path=`videos/${lecture.id}/${quality}-${Date.now()}-${safe(file.name)}`;await uploadFile(file,path);await db.from('video_assets').insert({lecture_id:lecture.id,quality,storage_path:path,original_name:file.name})}}
 const pdf=$('pdf').files[0];if(pdf){const path=`pdf/${lecture.id}-${Date.now()}-${safe(pdf.name)}`;await uploadFile(pdf,path);await db.from('lectures').update({pdf_path:path}).eq('id',lecture.id)}
 show('تم إنشاء المحاضرة ورفع الملفات بنجاح.');$('lt').value='';$('ld').value='';['v360','v480','v720','v1080','pdf'].forEach(x=>$(x).value='');load()
}catch(e){show(e.message||String(e),false)}}
function safe(n){return n.replace(/[^a-zA-Z0-9._-]/g,'_')}
function addQuestion(){qcount++;const n=qcount;const d=document.createElement('div');d.className='question';d.id='q'+n;d.innerHTML=`<b>السؤال ${n}</b><div class="field"><input id="qt${n}" placeholder="نص السؤال"></div><div class="form-grid"><input id="qa${n}" placeholder="الإجابة A"><input id="qb${n}" placeholder="الإجابة B"><input id="qc${n}" placeholder="الإجابة C"><input id="qd${n}" placeholder="الإجابة D"></div><div class="field"><label>الإجابة الصحيحة</label><select id="qcorrect${n}"><option>A</option><option>B</option><option>C</option><option>D</option></select></div>`;$('questions').appendChild(d)}
async function createExam(){try{const courseId=$('ec').value,title=$('et').value.trim();if(!courseId||!title)return show('اختر الكورس واكتب اسم الامتحان.',false);const er=await db.from('exams').insert({course_id:courseId,title,description:$('exd').value.trim(),duration_minutes:Number($('ed').value)||30,published:$('ep').checked}).select().single();if(er.error)throw er.error;const exam=er.data;const arr=[];for(let i=1;i<=qcount;i++){const text=$('qt'+i)?.value.trim();if(text)arr.push({exam_id:exam.id,question_text:text,option_a:$('qa'+i).value,option_b:$('qb'+i).value,option_c:$('qc'+i).value,option_d:$('qd'+i).value,correct_option:$('qcorrect'+i).value,position:i})}if(!arr.length)throw Error('أضف سؤالًا واحدًا على الأقل.');const qr=await db.from('questions').insert(arr);if(qr.error)throw qr.error;show('تم إنشاء الامتحان بنجاح.');$('questions').innerHTML='';qcount=0;load()}catch(e){show(e.message,false)}}
async function render(){let html='';for(const c of courses){const lr=await db.from('lectures').select('id,title,published,position,pdf_path').eq('course_id',c.id).order('position');const er=await db.from('exams').select('id,title,duration_minutes,published').eq('course_id',c.id).order('created_at');html+=`<div class="list-card"><b>${esc(c.title)}</b> — ${c.published?'منشور':'مخفي'}<div style="margin-top:8px"><b>المحاضرات:</b>${(lr.data||[]).map(l=>`<div style="padding:7px;background:#fafafa;margin:5px;border-radius:7px">${esc(l.title)} — ${l.published?'منشور':'مخفي'}</div>`).join('')||'<small>لا يوجد</small>'}</div><div style="margin-top:8px"><b>الامتحانات:</b>${(er.data||[]).map(e=>`<div style="padding:7px;background:#fafafa;margin:5px;border-radius:7px">${esc(e.title)} — ${e.duration_minutes} دقيقة — ${e.published?'منشور':'مخفي'}</div>`).join('')||'<small>لا يوجد</small>'}</div></div>`}$('content').innerHTML=html||'لا يوجد محتوى.'}
async function logout(){await db.auth.signOut();location.href='login.html'}
addQuestion();load();
</script></body></html>
