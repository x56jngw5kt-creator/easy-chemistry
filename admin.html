<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Admin | Easy Chemistry</title><link rel="stylesheet" href="styles.css"></head><body>
<header class="topbar"><div class="brand"><div class="brand-mark">⚗</div><div><h1>Easy Chemistry</h1><small>Admin Dashboard</small></div></div><div style="display:flex;gap:10px;align-items:center"><span id="userEmail" style="font-size:12px;color:#777"></span><button id="logout" class="login" style="border:0;cursor:pointer;font:inherit">تسجيل الخروج</button></div></header>
<main class="section"><div class="section-head"><div><span class="eyebrow">لوحة الإدارة</span><h2>إدارة المنصة 👋</h2></div></div>
<div id="message" style="display:none;padding:12px;border-radius:10px;margin-bottom:18px"></div>
<section class="feature-grid" style="margin-bottom:30px"><div><b>📚 الكورسات</b><p>أضف كورسًا جديدًا واجعله منشورًا للطلاب.</p><button class="login" onclick="openCourse()" style="border:0;cursor:pointer;font:inherit">+ إضافة كورس</button></div><div><b>🎥 المحاضرات</b><p>اختر كورسًا وأضف رابط الفيديو والـPDF.</p><button class="login" onclick="openLecture()" style="border:0;cursor:pointer;font:inherit">+ إضافة محاضرة</button></div></section>
<div class="section-head"><div><span class="eyebrow">المحتوى</span><h2>الكورسات والمحاضرات</h2></div></div>
<div id="coursesList"></div>
</main>
<div id="courseModal" class="modal"><div class="modal-box"><h2>إضافة كورس</h2><input id="ctitle" placeholder="اسم الكورس"><input id="cgrade" placeholder="الصف الدراسي"><textarea id="cdesc" placeholder="وصف الكورس"></textarea><input id="cthumb" placeholder="رابط صورة الغلاف (اختياري)"><label><input id="cpublished" type="checkbox"> نشر الكورس للطلاب</label><div class="modal-actions"><button class="login" onclick="saveCourse()">حفظ</button><button onclick="closeModals()">إلغاء</button></div></div></div>
<div id="lectureModal" class="modal"><div class="modal-box"><h2>إضافة محاضرة</h2><select id="lcourse"></select><input id="ltitle" placeholder="عنوان المحاضرة"><textarea id="ldesc" placeholder="وصف المحاضرة"></textarea><input id="lvideo" placeholder="رابط الفيديو"><input id="lpdf" placeholder="رابط PDF (اختياري)"><input id="lpos" type="number" value="1" min="1" placeholder="الترتيب"><label><input id="lpublished" type="checkbox"> نشر المحاضرة للطلاب</label><div class="modal-actions"><button class="login" onclick="saveLecture()">حفظ</button><button onclick="closeModals()">إلغاء</button></div></div></div>
<style>.modal{display:none;position:fixed;inset:0;background:#0008;z-index:50;place-items:center;padding:20px}.modal-box{background:#fff;border-radius:18px;padding:25px;width:min(520px,100%);box-shadow:0 20px 70px #0004}.modal-box input,.modal-box textarea,.modal-box select{width:100%;padding:12px;margin:7px 0;border:1px solid #ddd;border-radius:9px;font:inherit}.modal-box textarea{min-height:90px}.modal-actions{display:flex;gap:10px;margin-top:15px}.modal-actions button:last-child{padding:10px 18px;border:1px solid #ddd;background:#fff;border-radius:9px}.course-admin{background:#fff;border:1px solid #eee;border-radius:15px;padding:20px;margin-bottom:15px}.lecture-row{padding:12px;background:#fafafa;border-radius:9px;margin-top:8px}.danger{border:0;background:#fff0f0;color:#b00000;padding:7px 10px;border-radius:8px;cursor:pointer}.publish{border:0;background:#f1fff3;color:#167c2d;padding:7px 10px;border-radius:8px;cursor:pointer}</style>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="supabase-config.js"></script><script>
const client=supabase.createClient(SUPABASE_URL,SUPABASE_PUBLISHABLE_KEY);let session=null,courses=[];
function msg(t,ok=true){const e=document.getElementById('message');e.textContent=t;e.style.display='block';e.style.background=ok?'#effaf1':'#fff0f0';e.style.color=ok?'#176b2a':'#a40000';setTimeout(()=>e.style.display='none',3000)}
async function init(){const r=await client.auth.getSession();session=r.data.session;if(!session){location.href='login.html';return}document.getElementById('userEmail').textContent=session.user.email;const p=await client.from('profiles').select('role').eq('id',session.user.id).single();if(p.error||p.data?.role!=='admin'){await client.auth.signOut();alert('هذا الحساب ليس Admin');location.href='login.html';return}await loadCourses()}
async function loadCourses(){const r=await client.from('courses').select('*').order('created_at',{ascending:false});if(r.error)return msg(r.error.message,false);courses=r.data||[];renderCourses();fillCourseSelect()}
function renderCourses(){const box=document.getElementById('coursesList');if(!courses.length){box.innerHTML='<div class="course-admin">لا توجد كورسات بعد. اضغط «إضافة كورس» للبدء.</div>';return}box.innerHTML=courses.map(c=>`<div class="course-admin"><div style="display:flex;justify-content:space-between;gap:10px;align-items:center"><div><span class="eyebrow">${esc(c.grade||'')}</span><h3 style="margin:5px 0">${esc(c.title)}</h3><p style="color:#777">${esc(c.description||'')}</p></div><button class="danger" onclick="deleteCourse(${c.id})">حذف</button></div><div id="lec-${c.id}">جاري تحميل المحاضرات...</div></div>`).join('');courses.forEach(loadLectures)}
async function loadLectures(c){const r=await client.from('lectures').select('*').eq('course_id',c.id).order('position');const box=document.getElementById('lec-'+c.id);if(r.error){box.textContent=r.error.message;return}box.innerHTML=r.data.length?r.data.map(l=>`<div class="lecture-row"><b>🎥 ${esc(l.title)}</b><div style="font-size:12px;color:#777">${esc(l.description||'')}</div><div style="margin-top:7px">${l.published?'<span class="publish">منشورة</span>':'<span class="danger">مخفية</span>'} <button class="danger" onclick="deleteLecture(${l.id})">حذف</button></div></div>`).join(''):'<div style="font-size:13px;color:#777;margin-top:8px">لا توجد محاضرات.</div>'}
function fillCourseSelect(){document.getElementById('lcourse').innerHTML=courses.map(c=>`<option value="${c.id}">${esc(c.title)}</option>`).join('')}
function openCourse(){document.getElementById('courseModal').style.display='grid'}function openLecture(){if(!courses.length)return msg('أضف كورسًا أولًا.',false);document.getElementById('lectureModal').style.display='grid'}function closeModals(){document.querySelectorAll('.modal').forEach(x=>x.style.display='none')}
async function saveCourse(){const payload={title:ctitle.value.trim(),grade:cgrade.value.trim(),description:cdesc.value.trim(),thumbnail_url:cthumb.value.trim()||null,published:cpublished.checked};if(!payload.title)return msg('اكتب اسم الكورس.',false);const r=await client.from('courses').insert(payload);if(r.error)return msg(r.error.message,false);closeModals();['ctitle','cgrade','cdesc','cthumb'].forEach(id=>document.getElementById(id).value='');cpublished.checked=false;msg('تم إضافة الكورس بنجاح');loadCourses()}
async function saveLecture(){const payload={course_id:Number(lcourse.value),title:ltitle.value.trim(),description:ldesc.value.trim(),video_url:lvideo.value.trim()||null,pdf_url:lpdf.value.trim()||null,position:Number(lpos.value)||1,published:lpublished.checked};if(!payload.title)return msg('اكتب عنوان المحاضرة.',false);const r=await client.from('lectures').insert(payload);if(r.error)return msg(r.error.message,false);closeModals();['ltitle','ldesc','lvideo','lpdf'].forEach(id=>document.getElementById(id).value='');msg('تم إضافة المحاضرة بنجاح');loadCourses()}
async function deleteCourse(id){if(!confirm('حذف الكورس وكل محاضراته؟'))return;const r=await client.from('courses').delete().eq('id',id);if(r.error)return msg(r.error.message,false);msg('تم الحذف');loadCourses()}
async function deleteLecture(id){if(!confirm('حذف المحاضرة؟'))return;const r=await client.from('lectures').delete().eq('id',id);if(r.error)return msg(r.error.message,false);msg('تم الحذف');loadCourses()}
function esc(s){return String(s).replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[m]))}
document.getElementById('logout').onclick=async()=>{await client.auth.signOut();location.href='login.html'};init();
</script></body></html>
