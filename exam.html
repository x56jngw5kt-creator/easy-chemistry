<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>الامتحان | Easy Chemistry</title><link rel="stylesheet" href="styles.css"><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="supabase-config.js"></script>
<style>.wrap{max-width:900px;margin:auto;padding:30px 18px}.q{background:#fff;border:1px solid #eee;border-radius:15px;padding:20px;margin:14px 0}.opt{display:block;padding:11px;border:1px solid #eee;border-radius:9px;margin:7px 0;cursor:pointer}.opt input{margin-left:8px}.timer{position:sticky;top:80px;background:#d71920;color:#fff;padding:12px;border-radius:10px;text-align:center;font-weight:800;z-index:5}.result{background:#effaf1;padding:20px;border-radius:14px;margin-top:18px}</style></head><body>
<header class="topbar"><div class="brand"><div class="brand-mark">⚗</div><div><h1>Easy Chemistry</h1><small>Dr/Ahmed Mahmoud</small></div></div><a class="login" href="student.html">العودة للمنصة</a></header>
<main class="wrap"><div id="loading">جاري تحميل الامتحان...</div><div id="exam" style="display:none"><div class="timer">الوقت المتبقي: <span id="time"></span></div><h1 id="title"></h1><p id="desc" style="color:#777"></p><form id="form"></form><button class="redbtn" onclick="submitExam()">تسليم الامتحان</button><div id="result"></div></div></main>
<script>
const db=supabase.createClient(SUPABASE_URL,SUPABASE_PUBLISHABLE_KEY);const id=new URLSearchParams(location.search).get('id');let exam,questions=[],endAt,done=false;
async function init(){const {data:{user}}=await db.auth.getUser();if(!user){location.href='login.html';return}const e=await db.from('exams').select('*').eq('id',id).eq('published',true).single();if(e.error){loading.textContent='الامتحان غير متاح.';return}exam=e.data;const q=await db.from('exam_questions_public').select('*').eq('exam_id',id).order('position');if(q.error){loading.textContent=q.error.message;return}questions=q.data||[];title.textContent=exam.title;desc.textContent=exam.description||'';form.innerHTML=questions.map((x,i)=>`<div class="q"><h3>${i+1}. ${esc(x.question_text)}</h3>${[['A',x.option_a],['B',x.option_b],['C',x.option_c],['D',x.option_d]].map(o=>`<label class="opt"><input type="radio" name="q${x.id}" value="${o[0]}"> ${o[0]}) ${esc(o[1])}</label>`).join('')}</div>`).join('');loading.style.display='none';exam.style.display='block';startTimer()}
function esc(s){return String(s||'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[m]) )}
function startTimer(){endAt=Date.now()+exam.duration_minutes*60000;tick();window.timer=setInterval(tick,1000)}
function tick(){const sec=Math.max(0,Math.floor((endAt-Date.now())/1000));const m=Math.floor(sec/60),s=String(sec%60).padStart(2,'0');time.textContent=`${m}:${s}`;if(sec<=0){clearInterval(timer);submitExam()}}
async function submitExam(){if(done)return;done=true;clearInterval(timer);const answers=questions.map(q=>({question_id:q.id,answer:document.querySelector(`input[name="q${q.id}"]:checked`)?.value||''}));const r=await db.rpc('submit_exam',{p_exam_id:Number(id),p_answers:answers});if(r.error){done=false;return alert(r.error.message)}result.innerHTML=`<div class="result"><h2>تم التصحيح ✅</h2><p>درجتك: <b>${r.data.score}</b> من <b>${r.data.total}</b></p><p>الأسئلة التي أخطأت فيها تم حفظها تلقائيًا في «أخطائي».</p><a class="redbtn" href="student.html">العودة للمنصة</a></div>`;document.querySelectorAll('input,button').forEach(x=>x.disabled=true)}
init();
</script></body></html>
