<!doctype html>
<html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>الدخول | Easy Chemistry</title><link rel="stylesheet" href="styles.css"><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="supabase-config.js"></script>
<style>
.auth-wrap{min-height:100vh;display:grid;place-items:center;background:linear-gradient(135deg,#fff,#fff1f1);padding:20px}.auth-card{width:min(560px,100%);background:#fff;padding:30px;border-radius:24px;box-shadow:0 20px 70px #0001}.role-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin:18px 0}.role{padding:17px;border:1px solid #ddd;background:#fff;border-radius:13px;font:inherit;cursor:pointer}.role.active{border:2px solid var(--red);background:#fff5f5}.field{margin:10px 0}.field label{display:block;font-weight:700;font-size:13px;margin-bottom:5px}.field input,.field select{width:100%;padding:12px;border:1px solid #ddd;border-radius:10px;font:inherit}.form-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}.auth-btn{width:100%;padding:13px;border:0;border-radius:11px;background:var(--red);color:#fff;font:inherit;font-weight:800;cursor:pointer;margin-top:10px}.msg{display:none;margin-top:12px;padding:10px;border-radius:9px;font-size:13px}.msg.show{display:block}.err{background:#fff0f0;color:#a00000}.ok{background:#eefbf1;color:#176b2a}@media(max-width:600px){.form-grid{grid-template-columns:1fr}}
</style></head><body>
<div class="auth-wrap"><div class="auth-card">
<div style="text-align:center"><div class="brand-mark" style="margin:auto">⚗</div><h1 style="margin:8px 0">Easy Chemistry</h1><small>Dr/Ahmed Mahmoud</small></div>
<div class="tabs" style="display:grid;grid-template-columns:1fr 1fr;background:#f7f7f7;padding:4px;border-radius:12px;margin-top:20px"><button id="tLogin" class="role active" onclick="mode('login')">تسجيل الدخول</button><button id="tSignup" class="role" onclick="mode('signup')">إنشاء حساب</button></div>
<div id="loginBox"><h2>تسجيل الدخول</h2><p style="color:#777">اختار نوع الحساب.</p>
<div class="role-grid"><button id="studentRole" class="role active" onclick="setRole('student')">🎓<b>طالب</b><br><small>منصة الطالب</small></button><button id="adminRole" class="role" onclick="setRole('admin')">👨‍🏫<b>Admin</b><br><small>لوحة الإدارة</small></button></div>
<div class="field"><label>البريد الإلكتروني</label><input id="le" type="email"></div><div class="field"><label>كلمة المرور</label><input id="lp" type="password"></div><button class="auth-btn" onclick="login()">دخول</button></div>
<div id="signupBox" style="display:none"><h2>إنشاء حساب طالب</h2><div class="form-grid">
<div class="field"><label>اسم الطالب</label><input id="name"></div><div class="field"><label>رقم الطالب</label><input id="phone" inputmode="numeric" placeholder="010xxxxxxxx"></div>
<div class="field"><label>رقم ولي الأمر</label><input id="guardian" inputmode="numeric" placeholder="011xxxxxxxx"></div>
<div class="field"><label>الصف</label><select id="grade"><option value="">اختر الصف</option><option>الصف الرابع الابتدائي</option><option>الصف الخامس الابتدائي</option><option>الصف السادس الابتدائي</option><option>الصف الاول الإعدادي</option><option>الصف الثاني الإعدادي</option><option>الصف الثالث الإعدادي</option><option>الصف الاول الثانوي</option><option>الصف الثاني الثانوي عام</option><option>الصف الثاني الثانوي بكالوريا</option><option>الصف الثالث الثانوي</option></select></div>
<div class="field"><label>البريد الإلكتروني</label><input id="se" type="email"></div><div class="field"><label>كلمة المرور</label><input id="sp" type="password"></div>
</div><button class="auth-btn" onclick="signup()">إنشاء حساب الطالب</button><p style="font-size:11px;color:#888">لا يتم إنشاء حسابات Admin من التسجيل العام.</p></div>
<div id="msg" class="msg"></div><p style="text-align:center"><a href="index.html" style="color:var(--red)">← الرئيسية</a></p>
</div></div>
<script>
const db=supabase.createClient(SUPABASE_URL,SUPABASE_PUBLISHABLE_KEY);let role='student';
function mode(m){loginBox.style.display=m==='login'?'block':'none';signupBox.style.display=m==='signup'?'block':'none';tLogin.classList.toggle('active',m==='login');tSignup.classList.toggle('active',m==='signup');clearMsg()}
function setRole(r){role=r;studentRole.classList.toggle('active',r==='student');adminRole.classList.toggle('active',r==='admin')}
function show(t,ok=false){msg.textContent=t;msg.className='msg show '+(ok?'ok':'err')}
function clearMsg(){msg.className='msg'}
function validEG(v){return /^(010|011|012|015)\d{8}$/.test(v)}
async function login(){
 clearMsg();const email=le.value.trim(),pass=lp.value;
 if(!email||!pass)return show('اكتب البريد وكلمة المرور.');
 const {data,error}=await db.auth.signInWithPassword({email,password:pass});if(error)return show(error.message);
 const {data:p}=await db.from('profiles').select('role').eq('id',data.user.id).single();
 if(!p){await db.auth.signOut();return show('ملف المستخدم غير موجود.')}
 if(p.role!==role){await db.auth.signOut();return show(role==='admin'?'هذا الحساب ليس Admin.':'هذا الحساب ليس حساب طالب.')}
 location.href=role==='admin'?'admin.html':'student.html';
}
async function signup(){
 clearMsg();const n=name.value.trim(),ph=phone.value.trim(),gp=guardian.value.trim(),g=grade.value,e=se.value.trim(),p=sp.value;
 if(!n||!ph||!gp||!g||!e||!p)return show('أكمل جميع البيانات.');
 if(!validEG(ph)||!validEG(gp))return show('رقم الطالب وولي الأمر يجب أن يبدأ بـ 010 أو 011 أو 012 أو 015 ويكون 11 رقمًا.');
 if(p.length<6)return show('كلمة المرور 6 أحرف على الأقل.');
 const {data,error}=await db.auth.signUp({email:e,password:p,options:{data:{full_name:n}}});
 if(error)return show(error.message);
 if(!data.user)return show('تعذر إنشاء الحساب.');
 const {error:pe}=await db.from('profiles').insert({id:data.user.id,full_name:n,role:'student',phone:ph,guardian_phone:gp,grade:g});
 if(pe)return show('تم إنشاء الحساب لكن تعذر حفظ بيانات الطالب: '+pe.message);
 if(!data.session)return show('الحساب اتعمل، لكن Supabase ما زال يطلب تأكيد البريد. عطّل Confirm email من Authentication > Providers > Email ثم جرّب مرة أخرى.',false);
 show('تم إنشاء الحساب بنجاح. يمكنك تسجيل الدخول الآن.',true);mode('login');
}
</script></body></html>
